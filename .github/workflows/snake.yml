
name: Generate GitHub Contribution Animations

on:
  # Automatically run every day at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

# Allow GitHub Actions to publish generated SVG files
permissions:
  contents: write

jobs:
  generate:
    name: Generate Contribution Animations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Step 1: Generate Snake Animation
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: nagmodepankaj05
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: Generate Pac-Man Animation
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: nagmodepankaj05
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman"

      # Step 3: Verify generated SVG files
      - name: Verify Generated Files
        run: |
          echo "Checking generated SVG files..."

          ls -lh dist/

          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          test -s dist/pacman-contribution-graph.svg
          test -s dist/pacman-contribution-graph-dark.svg

          echo "All four SVG files generated successfully!"

      # Step 4: Publish animations to output branch
      - name: Publish Contribution Animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
